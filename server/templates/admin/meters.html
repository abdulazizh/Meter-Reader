<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المشتركين - لوحة تحكم المسؤول</title>
  <link rel="stylesheet" href="/admin-shared.css">
</head>
<body>
  <header class="header">
    <h1>لوحة تحكم المسؤول</h1>
    <div class="header-stats">
      <div class="stat-item">
        <div class="stat-value" id="totalMeters">0</div>
        <div class="stat-label">المشتركين</div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">تسجيل الخروج</button>
    </div>
  </header>

  <div class="nav-bar"></div>

  <div class="container">
    <div class="alert alert-success" id="successAlert"></div>
    <div class="alert alert-error" id="errorAlert"></div>

    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">إدارة المشتركين</h2>
        <div class="actions">
          <button class="btn btn-danger" onclick="deleteAllMeters()">حذف الكل</button>
          <button class="btn btn-primary" onclick="showAddMeterModal()">+ إضافة مشترك جديد</button>
        </div>
      </div>

      <div class="filters-row">
        <div class="filter-group">
          <label>البحث</label>
          <input type="text" id="meters-search" placeholder="رقم الحساب أو الاسم..." oninput="filterMeters()">
        </div>
        <div class="filter-group">
          <label>القارئ</label>
          <select id="reader-filter" onchange="filterMeters()">
            <option value="">جميع القراء</option>
          </select>
        </div>
        <div class="filter-group">
          <label>الصنف</label>
          <select id="meters-category-filter" onchange="filterMeters()">
            <option value="">جميع الأصناف</option>
          </select>
        </div>
        <div class="filter-group">
          <label>الحالة</label>
          <select id="meters-status-filter" onchange="filterMeters()">
            <option value="">الكل</option>
            <option value="read">تم القراءة</option>
            <option value="unread">لم تتم القراءة</option>
          </select>
        </div>
        <div class="filter-group">
          <label>الديون</label>
          <select id="meters-debts-filter" onchange="filterMeters()">
            <option value="">الكل</option>
            <option value="has">بديون</option>
            <option value="none">بدون ديون</option>
          </select>
        </div>
        <button class="btn-reset-filters" onclick="resetMetersFilters()">إعادة تعيين</button>
      </div>

      <div class="results-count" id="meters-count"></div>

      <div class="filters-row" style="background: #e8f4fd; border: 1px solid #bee5eb;">
        <div class="filter-group" style="flex: 1;">
          <label>القارئ</label>
          <select id="bulk-assign-reader" required>
            <option value="">اختر القارئ</option>
          </select>
        </div>
        <div class="filter-group" style="flex: 1;">
          <label>نوع التعيين</label>
          <select id="bulk-assign-type" onchange="toggleBulkAssignFields()">
            <option value="accountRange">نطاق حسابات</option>
            <option value="block">بلوك</option>
            <option value="record">سجل</option>
            <option value="category">الصنف</option>
          </select>
        </div>
        <div class="filter-group" id="bulk-assign-range-fields">
          <label>من الحساب</label>
          <input type="text" id="bulk-assign-start" placeholder="رقم الحساب الابتدائي">
        </div>
        <div class="filter-group" id="bulk-assign-end-field" style="display: none;">
          <label>إلى الحساب</label>
          <input type="text" id="bulk-assign-end" placeholder="رقم الحساب النهائي">
        </div>
        <div class="filter-group" id="bulk-assign-single-field" style="display: none;">
          <label>القيمة</label>
          <input type="text" id="bulk-assign-value" placeholder="القيمة (البلوك/السجل/الصنف)">
        </div>
        <button class="btn btn-success" onclick="bulkAssignMeters()" style="align-self: flex-end; height: fit-content;">تعيين جماعي</button>
      </div>

      <div class="loading" id="meters-loading">
        <div class="spinner"></div>
        <div>جاري التحميل...</div>
      </div>

      <table id="meters-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="accountNumber">رقم الحساب</th>
            <th class="sortable" data-sort="sequence">التسلسل</th>
            <th>رقم المقياس</th>
            <th class="sortable" data-sort="subscriberName">اسم المشترك</th>
            <th>العنوان</th>
            <th class="sortable" data-sort="category">الصنف</th>
            <th class="sortable" data-sort="previousReading">القراءة السابقة</th>
            <th class="sortable" data-sort="previousReadingDate">تاريخ القراءة</th>
            <th class="sortable" data-sort="currentAmount">المبلغ الحالي</th>
            <th class="sortable" data-sort="debts">الديون</th>
            <th class="sortable" data-sort="totalAmount">المجموع</th>
            <th>القارئ</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="meters-body"></tbody>
      </table>
      <div class="pagination" id="meters-pagination"></div>
    </div>
  </div>

  <div class="modal" id="meter-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="meter-modal-title">إضافة مشترك جديد</h3>
        <button class="modal-close" onclick="closeModal('meter-modal')">&times;</button>
      </div>
      <form id="meter-form" onsubmit="saveMeter(event)">
        <input type="hidden" id="meter-id">
        <div class="form-row">
          <div class="form-group">
            <label>رقم الحساب</label>
            <input type="text" id="meter-accountNumber" required>
          </div>
          <div class="form-group">
            <label>رقم المقياس</label>
            <input type="text" id="meter-meterNumber" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>التسلسل</label>
            <input type="text" id="meter-sequence" required>
          </div>
          <div class="form-group">
            <label>الصنف</label>
            <select id="meter-category" required>
              <option value="سكني">سكني</option>
              <option value="تجاري">تجاري</option>
              <option value="صناعي">صناعي</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>اسم المشترك</label>
          <input type="text" id="meter-subscriberName" required>
        </div>
        <div class="form-group">
          <label>العنوان</label>
          <input type="text" id="meter-address" placeholder="العنوان الكامل">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>السجل</label>
            <input type="text" id="meter-record" required>
          </div>
          <div class="form-group">
            <label>البلوك</label>
            <input type="text" id="meter-block" required>
          </div>
          <div class="form-group">
            <label>العقار</label>
            <input type="text" id="meter-property" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>القراءة السابقة</label>
            <input type="number" id="meter-previousReading" required>
          </div>
          <div class="form-group">
            <label>تاريخ القراءة السابقة</label>
            <input type="date" id="meter-previousReadingDate">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>المبلغ الحالي</label>
            <input type="number" id="meter-currentAmount" required>
          </div>
          <div class="form-group">
            <label>الديون</label>
            <input type="number" id="meter-debts" value="0">
          </div>
        </div>
        <div class="form-group">
          <label>القارئ المسؤول</label>
          <select id="meter-readerId" required></select>
        </div>
        <button type="submit" class="btn btn-primary">حفظ</button>
      </form>
    </div>
  </div>

  <div class="modal" id="meter-details-modal">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <h3 class="modal-title">تفاصيل المشترك</h3>
        <button class="modal-close" onclick="closeModal('meter-details-modal')">&times;</button>
      </div>
      <div id="meter-details-content"></div>
    </div>
  </div>

  <script>
    let meters = [];
    let allReadings = [];
    let categoryMapping = {};
    let metersSortField = 'sequence';
    let metersSortDir = 'asc';
    let metersPage = 1;
    const METERS_PER_PAGE = 50;

    function buildNav() {
      document.querySelector('.nav-bar').innerHTML = [
        '<a class="nav-link" href="/admin/dashboard">الإحصائيات</a>',
        '<a class="nav-link" href="/admin/readers">القراء</a>',
        '<a class="nav-link active" href="/admin/meters">المشتركين</a>',
        '<a class="nav-link" href="/admin/readings">القراءات</a>',
        '<a class="nav-link" href="/admin/import">رفع البيانات</a>',
        '<a class="nav-link" href="/admin/export">تصدير البيانات</a>'
      ].join('');
    }

    async function loadData() {
      try {
        const [metersRes, readersRes, readRes, statsRes] = await Promise.all([
          fetch('/api/admin/meters', { credentials: 'include' }),
          fetch('/api/admin/readers', { credentials: 'include' }),
          fetch('/api/admin/readings', { credentials: 'include' }),
          fetch('/api/admin/dashboard-stats', { credentials: 'include' })
        ]);
        if (metersRes.status === 401) { window.location.href = '/admin/login'; return; }
        meters = await metersRes.json();
        readers = await readersRes.json();
        allReadings = await readRes.json();
        const stats = await statsRes.json();
        categoryMapping = stats.categoryNames || {};
        document.getElementById('totalMeters').textContent = meters.length;
        updateReaderSelects(['reader-filter', 'meter-readerId', 'bulk-assign-reader']);
        document.getElementById('meter-readerId').innerHTML =
          readers.map(r => `<option value="${r.id}">${r.displayName}</option>`).join('');
        document.getElementById('bulk-assign-reader').innerHTML =
          '<option value="">اختر القارئ</option>' +
          readers.map(r => `<option value="${r.id}">${r.displayName}</option>`).join('');
        updateCategoryFilters();
        renderMeters();
        toggleBulkAssignFields();
        if (urlParam('view')) viewMeterDetails(urlParam('view'));
      } catch (error) {
        showError('فشل تحميل البيانات');
      }
    }

    function updateCategoryFilters() {
      const select = document.getElementById('meters-category-filter');
      const uniqueCategoryIds = [...new Set(meters.map(m => m.category).filter(Boolean))];
      uniqueCategoryIds.sort();
      select.innerHTML = '<option value="">جميع الأصناف</option>' +
        uniqueCategoryIds.map(id =>
          `<option value="${id}">${categoryMapping[id] || id}</option>`).join('');
    }

    function renderMeters() {
      const tbody = document.getElementById('meters-body');
      const filteredMeters = filterMetersData();
      const totalPages = Math.max(1, Math.ceil(filteredMeters.length / METERS_PER_PAGE));
      if (metersPage > totalPages) metersPage = totalPages;
      if (metersPage < 1) metersPage = 1;
      const start = (metersPage - 1) * METERS_PER_PAGE;
      const pageMeters = filteredMeters.slice(start, start + METERS_PER_PAGE);
      tbody.innerHTML = pageMeters.map(meter => {
        const reader = readers.find(r => r.id === meter.readerId);
        const hasReading = meter.latestReading !== null;
        const prevDate = meter.previousReadingDate ? new Date(meter.previousReadingDate).toLocaleDateString('ar-IQ') : '-';
        const currentAmount = parseFloat(meter.currentAmount || 0).toLocaleString('ar-IQ');
        const debts = parseFloat(meter.debts || 0).toLocaleString('ar-IQ');
        const totalAmount = parseFloat(meter.totalAmount || 0).toLocaleString('ar-IQ');
        return `
          <tr>
            <td>${meter.accountNumber}</td>
            <td>${meter.sequence}</td>
            <td>${meter.meterNumber}</td>
            <td>${meter.subscriberName}</td>
            <td>${meter.address || '-'}</td>
            <td>${categoryMapping[meter.category] || meter.category}</td>
            <td>${meter.previousReading?.toLocaleString('ar-IQ') || '-'}</td>
            <td>${prevDate}</td>
            <td>${currentAmount} د.ع</td>
            <td style="color: ${parseFloat(meter.debts || 0) > 0 ? '#dc3545' : 'inherit'}">${debts} د.ع</td>
            <td style="font-weight: bold; color: #1e5799">${totalAmount} د.ع</td>
            <td>${reader?.displayName || '-'}</td>
            <td><span class="badge ${hasReading ? 'badge-success' : 'badge-warning'}">${hasReading ? 'تم القراءة' : 'لم تتم القراءة'}</span></td>
            <td class="actions">
              <button class="btn btn-sm btn-primary" onclick="viewMeterDetails('${meter.id}')">عرض</button>
              <button class="btn btn-sm btn-secondary" onclick="editMeter('${meter.id}')">تعديل</button>
              <button class="btn btn-sm btn-danger" onclick="deleteMeter('${meter.id}')">حذف</button>
            </td>
          </tr>
        `;
      }).join('');
      updateMetersPagination(filteredMeters.length);
    }

    function updateMetersPagination(filteredCount) {
      const container = document.getElementById('meters-pagination');
      if (!container) return;
      const totalPages = Math.max(1, Math.ceil(filteredCount / METERS_PER_PAGE));
      container.innerHTML = `
        <button class="page-btn" onclick="metersPage = Math.max(1, metersPage - 1); renderMeters();" ${metersPage <= 1 ? 'disabled' : ''}>السابق</button>
        <span class="page-info">صفحة ${metersPage} من ${totalPages} (${filteredCount} مشترك)</span>
        <button class="page-btn" onclick="metersPage = Math.min(${totalPages}, metersPage + 1); renderMeters();" ${metersPage >= totalPages ? 'disabled' : ''}>التالي</button>
      `;
    }

    function filterMetersData() {
      const search = document.getElementById('meters-search').value.toLowerCase();
      const readerId = document.getElementById('reader-filter').value;
      const category = document.getElementById('meters-category-filter').value;
      const status = document.getElementById('meters-status-filter').value;
      const debtsFilter = document.getElementById('meters-debts-filter').value;

      let filtered = meters.filter(m => {
        const matchesSearch = !search ||
          m.accountNumber.toLowerCase().includes(search) ||
          m.subscriberName.toLowerCase().includes(search);
        const matchesReader = !readerId || m.readerId === readerId;
        const matchesCategory = !category || m.category === category;
        const hasReading = m.latestReading !== null;
        const matchesStatus = !status ||
          (status === 'read' && hasReading) ||
          (status === 'unread' && !hasReading);
        const hasDebts = parseFloat(m.debts || 0) > 0;
        const matchesDebts = !debtsFilter ||
          (debtsFilter === 'has' && hasDebts) ||
          (debtsFilter === 'none' && !hasDebts);
        return matchesSearch && matchesReader && matchesCategory && matchesStatus && matchesDebts;
      });

      filtered.sort((a, b) => {
        let valA = a[metersSortField];
        let valB = b[metersSortField];
        if (typeof valA === 'string') valA = valA.toLowerCase();
        if (typeof valB === 'string') valB = valB.toLowerCase();
        if (valA === null || valA === undefined) valA = '';
        if (valB === null || valB === undefined) valB = '';
        if (valA < valB) return metersSortDir === 'asc' ? -1 : 1;
        if (valA > valB) return metersSortDir === 'asc' ? 1 : -1;
        return 0;
      });

      document.getElementById('meters-count').textContent = `عرض ${filtered.length} من ${meters.length} مشترك`;
      return filtered;
    }

    function filterMeters() { metersPage = 1; renderMeters(); }

    function resetMetersFilters() {
      document.getElementById('meters-search').value = '';
      document.getElementById('reader-filter').value = '';
      document.getElementById('meters-category-filter').value = '';
      document.getElementById('meters-status-filter').value = '';
      document.getElementById('meters-debts-filter').value = '';
      metersSortField = 'sequence';
      metersSortDir = 'asc';
      updateSortIndicators('meters-table', metersSortField, metersSortDir);
      metersPage = 1;
      renderMeters();
    }

    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('sortable')) {
        const field = e.target.dataset.sort;
        const table = e.target.closest('table');
        if (table.id === 'meters-table') {
          if (metersSortField === field) {
            metersSortDir = metersSortDir === 'asc' ? 'desc' : 'asc';
          } else {
            metersSortField = field;
            metersSortDir = 'asc';
          }
          updateSortIndicators('meters-table', metersSortField, metersSortDir);
          metersPage = 1;
          renderMeters();
        }
      }
    });

    function toggleBulkAssignFields() {
      const type = document.getElementById('bulk-assign-type').value;
      const rangeFields = document.getElementById('bulk-assign-range-fields');
      const endField = document.getElementById('bulk-assign-end-field');
      const singleField = document.getElementById('bulk-assign-single-field');
      endField.style.display = 'none';
      singleField.style.display = 'none';
      rangeFields.style.display = 'none';
      if (type === 'accountRange') {
        rangeFields.style.display = 'block';
        endField.style.display = 'block';
      } else {
        singleField.style.display = 'block';
      }
    }

    async function bulkAssignMeters() {
      const readerId = document.getElementById('bulk-assign-reader').value;
      const type = document.getElementById('bulk-assign-type').value;
      if (!readerId) { showError('الرجاء اختيار القارئ'); return; }

      let filterValue = '';
      let filterValueEnd = '';
      if (type === 'accountRange') {
        filterValue = document.getElementById('bulk-assign-start').value;
        filterValueEnd = document.getElementById('bulk-assign-end').value;
        if (!filterValue || !filterValueEnd) { showError('الرجاء إدخال رقمي الحساب الابتدائي والنهائي'); return; }
      } else {
        filterValue = document.getElementById('bulk-assign-value').value;
        if (!filterValue) { showError('الرجاء إدخال القيمة'); return; }
      }

      try {
        const response = await fetch('/api/admin/meters/bulk-assign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ readerId, filterType: type, filterValue, filterValueEnd })
        });
        const result = await response.json();
        if (response.ok) {
          showSuccess(`تم تعيين ${result.count} مشترك/مشتركين بنجاح`);
          loadData();
        } else {
          showError(result.error || 'فشل تعيين المشتركين');
        }
      } catch (error) {
        showError('خطأ في الاتصال بالخادم');
      }
    }

    function showAddMeterModal() {
      document.getElementById('meter-modal-title').textContent = 'إضافة مشترك جديد';
      document.getElementById('meter-form').reset();
      document.getElementById('meter-id').value = '';
      document.getElementById('meter-modal').classList.add('active');
    }

    function editMeter(id) {
      const meter = meters.find(m => m.id === id);
      if (!meter) return;
      document.getElementById('meter-modal-title').textContent = 'تعديل العداد';
      document.getElementById('meter-id').value = meter.id;
      document.getElementById('meter-accountNumber').value = meter.accountNumber;
      document.getElementById('meter-meterNumber').value = meter.meterNumber;
      document.getElementById('meter-sequence').value = meter.sequence;
      document.getElementById('meter-category').value = meter.category;
      document.getElementById('meter-subscriberName').value = meter.subscriberName;
      document.getElementById('meter-address').value = meter.address || '';
      document.getElementById('meter-record').value = meter.record;
      document.getElementById('meter-block').value = meter.block;
      document.getElementById('meter-property').value = meter.property;
      document.getElementById('meter-previousReading').value = meter.previousReading;
      document.getElementById('meter-previousReadingDate').value = meter.previousReadingDate ? new Date(meter.previousReadingDate).toISOString().split('T')[0] : '';
      document.getElementById('meter-currentAmount').value = meter.currentAmount;
      document.getElementById('meter-debts').value = meter.debts || 0;
      document.getElementById('meter-readerId').value = meter.readerId;
      document.getElementById('meter-modal').classList.add('active');
    }

    async function saveMeter(event) {
      event.preventDefault();
      const id = document.getElementById('meter-id').value;
      const currentAmount = document.getElementById('meter-currentAmount').value;
      const debts = document.getElementById('meter-debts').value || '0';
      const data = {
        accountNumber: document.getElementById('meter-accountNumber').value,
        meterNumber: document.getElementById('meter-meterNumber').value,
        sequence: document.getElementById('meter-sequence').value,
        category: document.getElementById('meter-category').value,
        subscriberName: document.getElementById('meter-subscriberName').value,
        address: document.getElementById('meter-address').value || '',
        record: document.getElementById('meter-record').value,
        block: document.getElementById('meter-block').value,
        property: document.getElementById('meter-property').value,
        previousReading: parseInt(document.getElementById('meter-previousReading').value),
        previousReadingDate: document.getElementById('meter-previousReadingDate').value || null,
        currentAmount,
        debts,
        totalAmount: (parseFloat(currentAmount) + parseFloat(debts)).toString(),
        readerId: document.getElementById('meter-readerId').value,
      };

      try {
        const url = id ? `/api/admin/meters/${id}` : '/api/admin/meters';
        const method = id ? 'PUT' : 'POST';
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(data)
        });
        if (!response.ok) throw new Error();
        showSuccess(id ? 'تم تحديث العداد' : 'تم إضافة العداد');
        closeModal('meter-modal');
        loadData();
      } catch (error) {
        showError('فشل حفظ العداد');
      }
    }

    async function deleteMeter(id) {
      if (!confirm('هل أنت متأكد من حذف هذا العداد؟')) return;
      try {
        const response = await fetch(`/api/admin/meters/${id}`, {
          method: 'DELETE',
          credentials: 'include'
        });
        if (!response.ok) throw new Error();
        showSuccess('تم حذف العداد');
        loadData();
      } catch (error) {
        showError('فشل حذف العداد');
      }
    }

    async function deleteAllMeters() {
      if (!confirm('⚠️ تحذير: هل أنت متأكد من حذف جميع المشتركين؟\n\nسيتم حذف جميع المشتركين والقراءات المرتبطة بهم!\n\nهذا الإجراء لا يمكن التراجع عنه.')) return;
      if (!confirm('تأكيد نهائي: اضغط موافق لحذف جميع البيانات')) return;
      try {
        const response = await fetch('/api/admin/meters-all', {
          method: 'DELETE',
          credentials: 'include'
        });
        if (!response.ok) throw new Error();
        showSuccess('تم حذف جميع المشتركين بنجاح');
        loadData();
      } catch (error) {
        showError('فشل حذف المشتركين');
      }
    }

    function viewMeterDetails(id) {
      const meter = meters.find(m => m.id === id);
      if (!meter) return;
      const reader = readers.find(r => r.id === meter.readerId);
      const meterReadings = allReadings.filter(r => r.meterId === id);
      const prevDate = meter.previousReadingDate ? new Date(meter.previousReadingDate).toLocaleDateString('ar-IQ') : '-';

      let readingsHtml = '';
      if (meterReadings.length > 0) {
        readingsHtml = `
          <h4 style="margin: 20px 0 10px; color: #1a1a2e;">سجل القراءات (${meterReadings.length})</h4>
          <table style="width: 100%; font-size: 14px;">
            <thead>
              <tr style="background: #f8f9fa;">
                <th style="padding: 8px;">التاريخ</th>
                <th style="padding: 8px;">القراءة</th>
                <th style="padding: 8px;">سبب التخطي</th>
                <th style="padding: 8px;">الموقع</th>
                <th style="padding: 8px;">الصورة</th>
                <th style="padding: 8px;">ملاحظات</th>
              </tr>
            </thead>
            <tbody>
              ${meterReadings.map(r => {
                const rDate = r.readingDate ? new Date(r.readingDate).toLocaleDateString('ar-IQ') : new Date(r.createdAt).toLocaleDateString('ar-IQ');
                const rTime = r.readingDate ? new Date(r.readingDate).toLocaleTimeString('ar-IQ', {hour: '2-digit', minute: '2-digit'}) : '';
                const hasLoc = r.latitude && r.longitude;
                const locLink = hasLoc ? '<a href="https://www.google.com/maps?q=' + r.latitude + ',' + r.longitude + '" target="_blank" style="color: #1e5799;">خريطة</a>' : '-';
                const photoStatus = r.photoPath ? '<a href="/api/photo/' + r.photoPath + '" target="_blank" class="photo-link"><span class="badge badge-success">عرض الصورة</span></a>' : '<span class="badge badge-warning">لا</span>';
                return '<tr><td style="padding: 8px;">' + rDate + ' ' + rTime + '</td><td style="padding: 8px; font-weight: bold;">' + (r.newReading !== null ? r.newReading.toLocaleString('ar-IQ') : '-') + '</td><td style="padding: 8px;">' + (r.skipReason || '-') + '</td><td style="padding: 8px;">' + locLink + '</td><td style="padding: 8px;">' + photoStatus + '</td><td style="padding: 8px;">' + (r.notes || '-') + '</td></tr>';
              }).join('')}
            </tbody>
          </table>
        `;
      } else {
        readingsHtml = '<p style="color: #999; margin-top: 20px;">لا توجد قراءات مسجلة لهذا المشترك</p>';
      }

      document.getElementById('meter-details-content').innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div>
            <h4 style="color: #1e5799; margin-bottom: 15px;">معلومات المشترك</h4>
            <table style="width: 100%;">
              <tr><td style="padding: 8px; color: #666;">رقم الحساب:</td><td style="padding: 8px; font-weight: bold;">${meter.accountNumber}</td></tr>
              <tr><td style="padding: 8px; color: #666;">التسلسل:</td><td style="padding: 8px;">${meter.sequence}</td></tr>
              <tr><td style="padding: 8px; color: #666;">اسم المشترك:</td><td style="padding: 8px; font-weight: bold;">${meter.subscriberName}</td></tr>
              <tr><td style="padding: 8px; color: #666;">رقم المقياس:</td><td style="padding: 8px;">${meter.meterNumber}</td></tr>
              <tr><td style="padding: 8px; color: #666;">الصنف:</td><td style="padding: 8px;">${meter.category}</td></tr>
              <tr><td style="padding: 8px; color: #666;">العنوان:</td><td style="padding: 8px;">${meter.address || '-'}</td></tr>
              <tr><td style="padding: 8px; color: #666;">السجل/البلوك/العقار:</td><td style="padding: 8px;">${meter.record}/${meter.block}/${meter.property}</td></tr>
              <tr><td style="padding: 8px; color: #666;">القارئ المسؤول:</td><td style="padding: 8px;">${reader?.displayName || '-'}</td></tr>
            </table>
          </div>
          <div>
            <h4 style="color: #1e5799; margin-bottom: 15px;">معلومات القراءة والمبالغ</h4>
            <table style="width: 100%;">
              <tr><td style="padding: 8px; color: #666;">القراءة السابقة:</td><td style="padding: 8px; font-weight: bold; color: #1e5799;">${meter.previousReading?.toLocaleString('ar-IQ') || '-'}</td></tr>
              <tr><td style="padding: 8px; color: #666;">تاريخ القراءة:</td><td style="padding: 8px;">${prevDate}</td></tr>
              <tr><td style="padding: 8px; color: #666;">المبلغ الحالي:</td><td style="padding: 8px;">${parseFloat(meter.currentAmount || 0).toLocaleString('ar-IQ')} د.ع</td></tr>
              <tr><td style="padding: 8px; color: #666;">الديون:</td><td style="padding: 8px; color: #dc3545;">${parseFloat(meter.debts || 0).toLocaleString('ar-IQ')} د.ع</td></tr>
              <tr><td style="padding: 8px; color: #666; font-weight: bold;">المجموع:</td><td style="padding: 8px; font-weight: bold; color: #1e5799; font-size: 18px;">${parseFloat(meter.totalAmount || 0).toLocaleString('ar-IQ')} د.ع</td></tr>
              <tr><td style="padding: 8px; color: #666;">الحالة:</td><td style="padding: 8px;"><span class="badge ${meter.latestReading ? 'badge-success' : 'badge-warning'}">${meter.latestReading ? 'تم القراءة' : 'لم تتم القراءة'}</span></td></tr>
            </table>
          </div>
        </div>
        ${readingsHtml}
      `;
      document.getElementById('meter-details-modal').classList.add('active');
    }

    buildNav();
    loadData();
  </script>
  <script src="/admin-shared.js"></script>
</body>
</html>
